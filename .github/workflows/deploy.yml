name: Deploy Guide

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  # GitHub Pages is not available for private repositories on the free plan, so
  # this job is gated behind a repository variable. To turn deployment on:
  #   1. Settings → Pages → Source: "GitHub Actions"  (needs Pro/Team, or a public repo)
  #   2. gh variable set ENABLE_PAGES --body true --repo JanSimek/fallout2-guide
  # Until then the build job still runs on every push and catches broken links,
  # MDX errors and type failures.
  deploy:
    if: >-
      github.ref == 'refs/heads/master'
      && github.event_name == 'push'
      && vars.ENABLE_PAGES == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
